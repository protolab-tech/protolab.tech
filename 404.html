<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Page not found - The requested page doesn't exist on protolab.tech" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#0a0a0a" />
  <title>404 - Page Not Found | Protolab</title>
  <link rel="canonical" href="https://protolab.tech/404.html" />
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔧</text></svg>" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="404 - Page Not Found | Protolab" />
  <meta property="og:description" content="The requested page doesn't exist on protolab.tech" />
  <meta property="og:url" content="https://protolab.tech/404.html" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    rel="stylesheet">

  <style>
    :root {
      --bg-primary: #0a0a0a;
      --bg-secondary: #111111;
      --bg-card: #161616;
      --accent-blue: #3b82f6;
      --accent-blue-light: #60a5fa;
      --accent-glow: rgba(59, 130, 246, 0.4);
      --text-primary: #fafafa;
      --text-secondary: #a3a3a3;
      --text-muted: #737373;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-hover: rgba(255, 255, 255, 0.15);
      --glass-bg: rgba(255, 255, 255, 0.03);
      --glass-border: rgba(255, 255, 255, 0.1);
    }

    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Animated Background */
    .animated-bg {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
    }

    .gradient-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.45;
      animation: float 20s ease-in-out infinite;
    }

    .orb-1 {
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(59, 130, 246, 0.3) 0%, transparent 70%);
      top: -150px;
      right: -150px;
    }

    .orb-2 {
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.25) 0%, transparent 70%);
      bottom: -100px;
      left: -100px;
      animation-delay: -10s;
    }

    @keyframes float {

      0%,
      100% {
        transform: translate(0, 0) scale(1);
      }

      50% {
        transform: translate(-20px, 20px) scale(1.05);
      }
    }

    .container {
      text-align: center;
      max-width: 560px;
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 24px;
      padding: 56px 40px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
      position: relative;
      overflow: hidden;
      animation: fadeInUp 0.6s ease-out;
    }

    .container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--accent-blue), #8b5cf6, var(--accent-blue));
      background-size: 200% 100%;
      animation: gradient-slide 3s linear infinite;
    }

    @keyframes gradient-slide {
      0% {
        background-position: 0% 0%;
      }

      100% {
        background-position: 200% 0%;
      }
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .error-code {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(80px, 18vw, 140px);
      font-weight: 700;
      line-height: 1;
      letter-spacing: -4px;
      margin-bottom: 8px;
      background: linear-gradient(135deg, var(--accent-blue-light) 0%, var(--accent-blue) 50%, #8b5cf6 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    h2 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(24px, 5vw, 32px);
      font-weight: 700;
      letter-spacing: -1px;
      margin-bottom: 16px;
    }

    p {
      color: var(--text-secondary);
      font-size: 16px;
      max-width: 420px;
      margin: 0 auto 12px;
    }

    .links {
      margin-top: 36px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }

    .btn-primary {
      background: var(--accent-blue);
      color: white;
      padding: 14px 28px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      transition: all 0.3s ease;
      box-shadow: 0 0 30px var(--accent-glow);
    }

    .btn-primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 0 50px var(--accent-glow), 0 15px 40px rgba(0, 0, 0, 0.4);
    }

    .btn-secondary {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      color: var(--text-primary);
      padding: 14px 28px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      transition: all 0.3s ease;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--border-hover);
      transform: translateY(-2px);
    }

    .contact-link {
      display: inline-block;
      margin-top: 28px;
      color: var(--text-muted);
      font-size: 14px;
      text-decoration: none;
      transition: color 0.3s ease;
    }

    .contact-link:hover {
      color: var(--accent-blue-light);
    }

    a:focus-visible {
      outline: 2px solid var(--accent-blue);
      outline-offset: 2px;
    }

    @media (max-width: 480px) {
      .container {
        padding: 40px 24px;
      }

      .btn-primary,
      .btn-secondary {
        width: 100%;
        text-align: center;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
  <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
</head>

<body>
  <!-- Animated Background -->
  <div class="animated-bg">
    <div class="gradient-orb orb-1"></div>
    <div class="gradient-orb orb-2"></div>
  </div>

  <main class="container" role="main">
    <div class="error-code" aria-label="Error 404">404</div>
    <h2>Page Not Found</h2>
    <p>Sorry, the page you're looking for doesn't exist or has been moved.</p>
    <p>You might have typed the URL incorrectly, or the page may have been removed.</p>
    <nav class="links" aria-label="Navigation options">
      <a href="/" class="btn-primary" aria-label="Return to homepage">Back to Homepage</a>
      <a href="/service-appointments/" class="btn-secondary" aria-label="Book an appointment">Book an Appointment</a>
    </nav>
    <a href="mailto:info@protolab.tech" class="contact-link" aria-label="Contact us via email">Need help? Contact us →</a>
  </main>

  <!-- Structured Data for 404 page -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebPage",
      "name": "404 - Page Not Found",
      "description": "The requested page doesn't exist on protolab.tech",
      "url": "https://protolab.tech/404.html",
      "isPartOf": {
        "@type": "WebSite",
        "name": "Protolab",
        "url": "https://protolab.tech/"
      }
    }
  </script>

  <script src="/assets/js/monitoring.js" defer></script>
</body>

</html>
